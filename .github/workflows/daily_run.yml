name: Real-Time Model Poller

on:
  push:
    branches:
      - main
  schedule:
    # Slots sit ~1h AFTER each publication completes, not before it.
    # Empirical git-history check showed the old even-hour slots (0 4,10,16,22)
    # raced every GFS/GEFS upload (files land ~40-70 min after even hours) so
    # EVERY cycle slipped to the next slot and displayed ~6.5h late.
    # GFS/GEFS pairs complete ~04:30/10:30/16:30/22:30 UTC; slots at
    # 05:30/11:30/17:30/23:30 catch them ~1h later.
    # ECMWF/AIFS open data lands ~07:00-08:15 and ~19:00-20:15; slots at
    # 09:00/21:00 catch those within ~1-2.5h.
    - cron: "30 5,11,17,23 * * *"
    - cron: "0 9,21 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    
    # Prevent overlapping poller runs
    concurrency:
      group: weather-poller
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p data/ecmwf
          mkdir -p data/gfs
          mkdir -p data/normals
          mkdir -p data/open_meteo
          mkdir -p data/weights
          mkdir -p outputs/maps
          mkdir -p data/aigfs
          mkdir -p data/hgefs
          mkdir -p data/aigfs_grib
          mkdir -p data/hgefs_grib
          mkdir -p data/aigefs/cities
          mkdir -p data/aifs_ens/cities
          mkdir -p data/ukmo_ens/cities
          mkdir -p data/ec46/cities
          mkdir -p data/google_wn2/cities

      - name: Copy normals file
        run: |
          cp data/us_daily_normals.csv data/normals/us_daily_normals.csv || true

      - name: Run Model Poller
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          EIA_KEY: ${{ secrets.EIA_KEY }}
        run: |
          python scripts/market_logic/fetch_live_grid.py || echo "[WARN] Live grid fetch failed — continuing pipeline."
          python scripts/poll_models.py
          python scripts/generate_maps.py || echo "[WARN] Map generation failed."
          python scripts/market_logic/fetch_gas_burn_history.py || echo "[WARN] Gas burn history failed."
          python scripts/market_logic/fetch_thermal_history.py || echo "[WARN] Thermal history failed."
          python scripts/market_logic/fetch_outages.py || echo "[WARN] Outage fetch failed."
          python scripts/market_logic/fetch_peaker_proxy.py || echo "[WARN] Peaker proxy failed."
          python scripts/market_logic/build_burn_sensitivity.py || echo "[WARN] Burn sensitivity analytics failed."

      - name: Trigger Kaggle AI Inference Kernel (00z/12z Major Cycles Only)
        if: env.NEW_DATA_FOUND == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          HOUR=$(date -u +%-H)
          echo "Current UTC Hour: $HOUR"
          
          # Exactly ONE AI inference per major cycle, driven by the GFS/GEFS
          # sync slots (05:30 for 00z, 17:30 for 12z). The ECMWF-only slots
          # (09:00/21:00) must NOT re-trigger GPU spend for the same cycle —
          # the old range-based window (3-9z / 15-21z) would now double-fire.
          if [[ $HOUR -eq 5 || $HOUR -eq 17 ]]; then
             echo "Major cycle window detected. Triggering Kaggle AI models..."
             pip install kaggle -q
             if kaggle kernels push -p scripts/kaggle_env; then
               echo "Kernel push succeeded. Will poll for completion."
               echo "RUN_KAGGLE=true" >> $GITHUB_ENV
             else
               echo "[WARN] Kaggle push failed (auth issue? API down?). Skipping poll."
               echo "RUN_KAGGLE=false" >> $GITHUB_ENV
             fi
          else
             echo "Minor cycle window. Skipping AI Inference to save Kaggle quotas."
             echo "RUN_KAGGLE=false" >> $GITHUB_ENV
          fi

      - name: Poll Kaggle until kernel completes
        if: env.RUN_KAGGLE == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python -u scripts/poll_kaggle_robust.py

      - name: Download Kaggle kernel output
        if: env.RUN_KAGGLE == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p data/ai_models
          mkdir -p data/fourcastnetv2-small/cities
          kaggle kernels output prateekriders/weather-dd-ai-inference -p /tmp/kaggle_out
          # CSVs are saved to /kaggle/working/output/ inside the kernel
          find /tmp/kaggle_out -name "*.csv" -exec cp {} data/ai_models/ \;
          # JSONs are renamed to strip the 'fourcastnetv2-small_' prefix so they match bubble run naming
          for f in /tmp/kaggle_out/*.json; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              newname=${base#fourcastnetv2-small_}
              cp "$f" "data/fourcastnetv2-small/cities/$newname"
            fi
          done
          echo "Downloaded AI Model CSV files:"
          ls -la data/ai_models/ || true
          echo "Downloaded FOURCASTNETV2-SMALL City JSON files:"
          ls -la data/fourcastnetv2-small/cities/ || true

      - name: Run Repo Cleanup
        if: env.NEW_DATA_FOUND == 'true'
        run: |
          python scripts/cleanup_repo.py
          echo "Final storage check:"
          du -sh outputs/maps/ data/gefs_subseasonal/

      - name: Commit pipeline state and AI model results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/pipeline_state.json outputs/ outputs/health/ data/ecmwf/ data/gfs/ data/ecmwf_aifs/ data/ecmwf_ens/ data/ai_models/ data/weights/ data/normals/ data/aigfs/ data/hgefs/ data/aigfs_grib/ data/hgefs_grib/ data/cmc_ens/ data/icon/ data/aigefs/ data/aifs_ens/ data/ukmo_ens/ data/ec46/ data/google_wn2/ || true
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Auto-update: Pipeline state & metrics $(date '+%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && echo "Push succeeded" && break
            echo "Push attempt $i failed, retrying in 15s..."
            sleep 15
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
