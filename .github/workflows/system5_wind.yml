name: System 5 - Wind Drought Tracker

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

permissions:
  contents: write
  actions: write

jobs:
  run-wind-drought:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tip of the branch at job start, not the triggering commit: a run
          # queued behind another would otherwise start from stale outputs and
          # hit a rebase conflict (tdd_master.csv) at commit time.
          ref: ${{ github.ref_name }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install pandas numpy requests
          
      - name: Run System 5
        env:
          EIA_KEY: ${{ secrets.EIA_KEY }}
        run: python scripts/wind/forecast_wind_power.py
        
      - name: Run Solar Power Forecast
        env:
          EIA_KEY: ${{ secrets.EIA_KEY }}
        run: python scripts/wind/forecast_solar_power.py
        
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs/wind/ outputs/health/
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Auto-update: Wind Forecast $(date '+%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          for i in 1 2 3 4 5; do
            { git pull --rebase -X theirs --autostash origin main || { git rebase --abort 2>/dev/null; false; }; } && git push && echo "Push succeeded" && break
            echo "Push attempt $i failed, retrying in 15s..."
            sleep 15
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scheduler watchdog (restart the dispatcher if it stopped)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/scheduler.py --ensure
