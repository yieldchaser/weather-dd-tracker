name: TEMP probe Open-Meteo metadata
on:
  push:
    branches: [claude/peaceful-cori-avfgpu]
    paths: [.github/workflows/probe_wn3.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          tries = {
            "ensemble-api": ["cmc_gem_geps", "gem_global_ensemble", "cmc_gem_geps_ensemble", "gem_ensemble", "cmc_geps"],
            "seasonal-api": ["ecmwf_ec46", "ecmwf_ec46_ensemble", "ec46"],
            "api": ["dwd_icon", "dwd_icon_eu", "dwd_icon_d2", "icon_seamless", "icon_global", "ncep_gfs025", "ecmwf_ifs025", "ncep_nbm_conus"],
            "single-runs-api": ["ncep_aigfs025", "ncep_hgefs025_ensemble_mean", "ncep_hgefs025"],
          }
          for host, names in tries.items():
              for m in names:
                  url = f"https://{host}.open-meteo.com/data/{m}/static/meta.json"
                  try:
                      with urllib.request.urlopen(url, timeout=20) as r:
                          j = json.loads(r.read())
                      print("OK ", host, m, {k: j.get(k) for k in ("last_run_initialisation_time", "last_run_availability_time", "update_interval_seconds")})
                  except Exception as e:
                      print("NO ", host, m, str(e)[:40])
          PY
