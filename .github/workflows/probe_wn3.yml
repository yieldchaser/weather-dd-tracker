name: TEMP probe WeatherNext 3 on Open-Meteo
on:
  push:
    branches: [claude/peaceful-cori-avfgpu]
    paths: [.github/workflows/probe_wn3.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Open-Meteo ensemble API
        run: |
          python3 - <<'PY'
          import json, urllib.request
          for m in ["google_weathernext3_ensemble_mean", "google_weathernext2_ensemble_mean", "ecmwf_ifs025", "ecmwf_ifs025_ensemble",
                    "gem_global_ensemble", "ecmwf_aifs025_ensemble", "ukmo_global_ensemble_20km", "ncep_aigefs025", "ncep_gefs025"]:
              url = f"https://ensemble-api.open-meteo.com/data/{m}/static/meta.json"
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      j = json.loads(r.read())
                  print("META", m, {k: v for k, v in j.items() if k != "crs_wkt"})
              except Exception as e:
                  print("META", m, "ERR", str(e)[:80])
          PY
