name: TEMP probe MJO feeds
on:
  push:
    branches: [claude/peaceful-cori-avfgpu]
    paths: [.github/workflows/probe_wn3.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in \
            "http://www.bom.gov.au/climate/mjo/graphics/rmm.74toRealtime.txt" \
            "https://www.bom.gov.au/climate/mjo/graphics/rmm.74toRealtime.txt" \
            "https://psl.noaa.gov/mjo/mjoindex/romi.cpcolr.1x.txt" \
            "https://psl.noaa.gov/mjo/mjoindex/omi.1x.txt" \
            "https://ncics.org/pub/mjo/v2/data/rmm.txt" \
            "https://www.cpc.ncep.noaa.gov/products/precip/CWlink/daily_mjo_index/proj_norm_order.ascii"; do
            echo "=== $u"; curl -sSL -m 30 -A "Mozilla/5.0" "$u" -o /tmp/f -w "HTTP %{http_code} size %{size_download}\n" || echo FAIL
            head -c 300 /tmp/f | head -4; echo; tail -3 /tmp/f; echo
          done
