name: Pipeline Scheduler

# Dispatches each workflow at its slot when GitHub's cron has not started it
# (scheduled runs are often hours late or skipped). Self-chaining: each run
# lasts ~5h40m, then dispatches the next one. The cron below only restarts the
# chain if it ever stops; a newer run replaces an older one.
on:
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Loop length in minutes (default 340)"
        required: false
        default: "340"
  schedule:
    - cron: "17 */4 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: pipeline-scheduler
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/scheduler.py
          sparse-checkout-cone-mode: false
      - name: Dispatch overdue workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_MINUTES: ${{ inputs.loop_minutes }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/scheduler.py
